<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14532D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>Laporan Keuangan — BarberDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="./js/perhitungan.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/database.js"></script>
    <script src="./js/firebase-config.js"></script>
    <script src="./js/sidebar.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div id="app-sidebar"></div>
      <div class="app-main">
        <div id="app-topbar"></div>

        <main class="page-content">
          <div class="page-header">
            <div>
              <h1 class="page-title">Laporan Laba Rugi &amp; Arus Kas Terpusat</h1>
              <p class="page-subtitle">
                Khusus Owner &amp; Developer · Dihitung otomatis dari FinanceEngine terpusat.
              </p>
            </div>
            <div class="header-actions">
              <div class="date-range-box">
                <input type="date" id="rep-start" />
                <span class="text-muted">s/d</span>
                <input type="date" id="rep-end" />
              </div>
              <button type="button" id="btn-export-csv" class="btn btn-dark">Export CSV</button>
            </div>
          </div>

          <section class="grid-12">
            <!-- Laba Rugi -->
            <div class="panel panel-pad col-7">
              <h2 class="panel-title" id="pnl-title">Laporan Laba Rugi Toko</h2>
              <p class="panel-sub" id="pnl-sub"></p>
              <div id="pnl-rows" style="margin-top:18px;"></div>
            </div>

            <!-- Arus Kas & Kontribusi Capster -->
            <div class="col-5" style="display:flex;flex-direction:column;gap:20px;">
              <div class="panel panel-pad">
                <h2 class="panel-title">Arus Kas per Metode Bayar</h2>
                <div id="cashflow-rows" style="margin-top:14px;"></div>
              </div>

              <div class="panel panel-pad">
                <h2 class="panel-title">Kontribusi Bagi Hasil per Capster</h2>
                <div id="capster-contrib-rows" style="margin-top:14px;"></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script>
      (async function () {
        var ctx = await window.BarberLayout.init('laporan', 'Laporan Keuangan');
        if (!ctx) return;

        var FE = window.FinanceEngine;
        var DB = window.BarberDB;

        var startEl = document.getElementById('rep-start');
        var endEl = document.getElementById('rep-end');
        startEl.value = FE.daysAgoYmd(29);
        endEl.value = FE.todayYmd();

        var latestLedger = null;
        var latestCapRows = [];
        var latestSettings = null;

        function lineRow(label, value, opts) {
          var o = opts || {};
          var padLeft = o.indent ? 'padding-left:16px;' : '';
          var cls = o.bold ? 'fw-700' : '';
          var valCls = o.valClass || '';
          var fontSz = o.sub ? 'font-size:12px;' : 'font-size:13px;';
          return (
            '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);' + padLeft + fontSz + '">' +
              '<span class="' + (o.bold ? 'fw-600' : 'text-secondary') + '">' + label + '</span>' +
              '<span class="mono ' + cls + ' ' + valCls + '">' + value + '</span>' +
            '</div>'
          );
        }

        async function renderReports() {
          var db = await DB.loadState();
          var split = FE.getSplitConfig(db.settings);
          var start = startEl.value;
          var end = endEl.value;
          var L = FE.calculateLedger(db, start, end);
          var caps = FE.calculateCapsterPayroll(db, start, end);
          latestLedger = L;
          latestCapRows = caps;
          latestSettings = db.settings;

          document.getElementById('pnl-title').textContent =
            'Laporan Laba Rugi Toko (' + FE.formatDateShort(start) + ' — ' + FE.formatDateShort(end) + ')';
          document.getElementById('pnl-sub').textContent =
            L.transactionCount + ' transaksi selesai · ' + L.voidCount + ' transaksi dibatalkan (void)';

          document.getElementById('pnl-rows').innerHTML =
            lineRow('Total Omzet Jasa (' + L.serviceUnitsCount + ' layanan)', FE.formatRupiah(L.grossServiceRevenue)) +
            lineRow('Dikurangi: Hak Komisi Jasa Capster (' + split.capsterPct + '%)', '-' + FE.formatRupiah(L.totalCapsterServiceShare), { indent: true, sub: true, valClass: 'text-brass' }) +
            lineRow('Pendapatan Jasa Bagian Toko (' + split.shopPct + '%)', FE.formatRupiah(L.totalShopServiceShare), { bold: true, valClass: 'text-green' }) +
            lineRow('Penjualan Produk Retail (' + L.productUnitsCount + ' unit)', FE.formatRupiah(L.totalProductSales)) +
            lineRow('Dikurangi: HPP / Harga Modal Produk', '-' + FE.formatRupiah(L.totalProductCost), { indent: true, sub: true }) +
            lineRow('Dikurangi: Komisi Capster atas Produk', '-' + FE.formatRupiah(L.totalCapsterProductShare), { indent: true, sub: true, valClass: 'text-brass' }) +
            lineRow('Laba Kotor Produk Retail', FE.formatRupiah(L.productGrossProfit), { bold: true, valClass: 'text-green' }) +
            (L.totalDiscount > 0 ? lineRow('Dikurangi: Diskon Toko', '-' + FE.formatRupiah(L.totalDiscount), { sub: true, valClass: 'text-red' }) : '') +
            lineRow('Dikurangi: Pengeluaran Operasional Toko', '-' + FE.formatRupiah(L.operationalExpenses), { valClass: 'text-red' }) +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:16px;">' +
              '<span class="fw-700" style="font-size:15px;">Laba Bersih Toko</span>' +
              '<span class="mono fw-700 ' + (L.netShopProfit >= 0 ? 'text-green' : 'text-red') + '" style="font-size:24px;">' + FE.formatRupiah(L.netShopProfit) + '</span>' +
            '</div>';

          document.getElementById('cashflow-rows').innerHTML =
            lineRow('Kas Masuk Tunai', FE.formatRupiah(L.cashInTunai), { bold: true }) +
            lineRow('Kas Masuk QRIS', FE.formatRupiah(L.cashInQris), { bold: true }) +
            lineRow('Kas Masuk Transfer', FE.formatRupiah(L.cashInTransfer), { bold: true }) +
            lineRow('Total Kas Keluar (Operasional + Gaji Cair)', '-' + FE.formatRupiah(L.allExpensesIncludingPayroll), { valClass: 'text-red' }) +
            '<div style="display:flex;justify-content:space-between;padding-top:12px;">' +
              '<span class="fw-700">Saldo Kas Bersih Periode</span>' +
              '<span class="mono fw-700">' + FE.formatRupiah(L.cashOnHandBalance) + '</span>' +
            '</div>';

          document.getElementById('capster-contrib-rows').innerHTML = caps.map(function (c) {
            return (
              '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:12px;">' +
                '<div><div class="fw-600">' + c.capster.name + '</div><div class="text-muted">' + c.serviceCount + ' potong · Omzet ' + FE.formatRupiah(c.grossServiceRevenue) + '</div></div>' +
                '<div class="text-right mono"><div class="fw-600 text-green">Toko ' + FE.formatRupiah(c.shopServiceContribution) + '</div><div class="text-brass">Capster ' + FE.formatRupiah(c.totalEarnedCommission) + '</div></div>' +
              '</div>'
            );
          }).join('');
        }

        document.getElementById('btn-export-csv').addEventListener('click', function () {
          if (!latestLedger) return;
          var L = latestLedger;
          var split = FE.getSplitConfig(latestSettings);
          var brand = (latestSettings && (latestSettings.appName || latestSettings.shopName)) || 'BarberDesk';
          var slug = String(brand).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'laporan';
          var rows = [
            ['Laporan Keuangan Terpusat ' + brand, startEl.value + ' s/d ' + endEl.value],
            [],
            ['Komponen', 'Nilai (IDR)'],
            ['Total Omzet Kotor', L.grossRevenue],
            ['Omzet Jasa', L.grossServiceRevenue],
            ['Hak Komisi Capster (' + split.capsterPct + '% + Produk)', L.totalCapsterShare],
            ['Bagian Jasa Toko (' + split.shopPct + '%)', L.totalShopServiceShare],
            ['Penjualan Produk Retail', L.totalProductSales],
            ['HPP Produk', L.totalProductCost],
            ['Laba Kotor Produk', L.productGrossProfit],
            ['Pengeluaran Operasional', L.operationalExpenses],
            ['Laba Bersih Toko', L.netShopProfit],
            ['Kas Tunai', L.cashInTunai],
            ['Kas QRIS', L.cashInQris],
            ['Kas Transfer', L.cashInTransfer],
            [],
            ['Capster', 'Jasa', 'Omzet Jasa', 'Hak Capster', 'Kontribusi Toko (' + split.shopPct + '%)'],
          ].concat(
            latestCapRows.map(function (c) {
              return [c.capster.name, c.serviceCount, c.grossServiceRevenue, c.totalEarnedCommission, c.shopServiceContribution];
            })
          );

          var csv = rows.map(function (r) {
            return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
          }).join('\n');
          var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'laporan-' + slug + '-' + startEl.value + '-sd-' + endEl.value + '.csv';
          a.click();
          URL.revokeObjectURL(url);
        });

        startEl.addEventListener('change', renderReports);
        endEl.addEventListener('change', renderReports);
        renderReports();
      })();
    </script>
  </body>
</html>
